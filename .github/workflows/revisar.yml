name: Revisar cambios
# Corre en cada Pull Request y en cada push a master y a las ramas de colaboradores:
# si algo no compila, una prueba falla o la documentación de traspaso se rompe, sale en rojo. No publica nada.
# Sin e2e, shots ni perf: necesitan la GPU del Mac y los servidores pm2 (puerta local: npm run verificar -- --nivel puerta).
on:
  pull_request:
  push:
    branches: [master, palmbeach-branch, "palmbeach/**"]
permissions:
  contents: read
concurrency: { group: "revisar-${{ github.ref }}", cancel-in-progress: true }
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm run test:todo
      - run: npm run balance:check
      - run: npm run docs:check
      - run: node scripts/todos.check.mjs
      - run: npm run build
