:root{--jm-naranja:#f08a24;--jm-texto:#eee6da;--jm-fondo:#0d0f13;--jm-panel:#161a21;--jm-borde:#374151}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--jm-fondo) url(credits-hero.webp) center/cover no-repeat fixed;color:var(--jm-texto);font:500 18px/1.45 Rajdhani,system-ui,sans-serif;padding:24px 16px}
main{max-width:760px;margin:0 auto}
section,header{background:var(--jm-panel);border:2px solid var(--jm-naranja);padding:20px;margin:0 0 16px;overflow-wrap:anywhere}
h1{margin:0 0 8px;font-size:clamp(34px,9vw,64px);line-height:.9;letter-spacing:.04em;text-transform:uppercase;color:var(--jm-naranja)}
h2{margin:0 0 10px;font-size:26px;letter-spacing:.06em;text-transform:uppercase;color:var(--jm-naranja)}
h3{margin:16px 0 6px;font-size:19px;letter-spacing:.06em;text-transform:uppercase}
p{margin:0 0 12px}p:last-child{margin-bottom:0}
ul{margin:0 0 12px;padding-left:20px}

.tbl{overflow-x:auto}

</style></head><body><main>
<header>
<h1>Cambios</h1>
<p>Historial completo de novedades, del más reciente al más antiguo.</p>
<p><a href="index.html">Volver a la portada</a> · <a href="como-se-juega.html">Cómo se juega</a></p>
</header>
<div id="lista"></div>
<script>
const lista = document.getElementById("lista");
function vacio() {
  const s = document.createElement("section"), p = document.createElement("p");
  p.textContent = "Sin novedades disponibles"; s.append(p); lista.replaceChildren(s);
}
fetch("novedades.json").then(r => r.ok ? r.json() : Promise.reject()).then(d => {
  const l = d.filter(e => e && e.titulo);
  if (!l.length) return vacio();
  const g = new Map();
  for (const e of l.sort((a, b) => (b.fecha || "").localeCompare(a.fecha || ""))) {
    const k = e.fecha || "Sin fecha";
    if (!g.has(k)) g.set(k, []);
    g.get(k).push(e);
  }
  for (const [f, es] of g) {
    const s = document.createElement("section"), h = document.createElement("h2");
    h.textContent = f; s.append(h);
    for (const e of es) {
      const p = document.createElement("p"), b = document.createElement("b");
      b.textContent = e.titulo; p.append(b, " " + (e.texto || "")); s.append(p);
    }
    lista.append(s);
  }
}).catch(vacio);
</script>
</main></body></html>
