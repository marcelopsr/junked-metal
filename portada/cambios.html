<header>
<h1>Cambios</h1>
<p>Historial completo de novedades, del más reciente al más antiguo.</p>
<p><a href="index.html">Volver a la portada</a> · <a href="como-se-juega.html">Cómo se juega</a></p>
</header>
<div id="lista"></div>
<script>
const lista = document.getElementById("lista");
function vacio() {
  const s = document.createElement("section"), p = document.createElement("p");
  p.textContent = "Sin novedades disponibles"; s.append(p); lista.replaceChildren(s);
}
fetch("novedades.json").then(r => r.ok ? r.json() : Promise.reject()).then(d => {
  const l = d.filter(e => e && e.titulo);
  if (!l.length) return vacio();
  const g = new Map();
  for (const e of l.sort((a, b) => (b.fecha || "").localeCompare(a.fecha || ""))) {
    const k = e.fecha || "Sin fecha";
    if (!g.has(k)) g.set(k, []);
    g.get(k).push(e);
  }
  for (const [f, es] of g) {
    const s = document.createElement("section"), h = document.createElement("h2");
    h.textContent = f; s.append(h);
    for (const e of es) {
      const p = document.createElement("p"), b = document.createElement("b");
      b.textContent = e.titulo; p.append(b, " " + (e.texto || "")); s.append(p);
    }
    lista.append(s);
  }
}).catch(vacio);
</script>
</main></body></html>
