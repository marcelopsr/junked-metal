<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estado del servicio · Junked Metal</title>
<meta name="description" content="Estado público de Junked Metal: juego, online e ingreso.">
<link rel="canonical" href="https://marcelopsr.github.io/junked-metal/estado.html">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap">
<link rel="stylesheet" href="guias.css">
<style>
.fila{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--jm-borde);padding:12px 0;font-size:22px}
.fila:first-of-type{border-top:0}
.fila span:last-child{display:inline-flex;align-items:center;gap:8px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:17px;padding:2px 12px;border:1px solid currentColor;border-radius:999px}
.fila span:last-child::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.ok span:last-child{color:var(--jm-verde);background:rgba(34,197,94,.12)}.caido span:last-child{color:var(--jm-rojo);background:rgba(255,59,46,.12)}
#hora{margin-top:8px;color:var(--jm-texto2);font-size:15px}
</style></head><body><main>
<header>
<h1>Estado del servicio</h1>
<p>Cómo están hoy el juego, el modo online y el ingreso.</p>
<p><a href="index.html">Volver a la portada</a></p>
</header>
<section aria-live="polite"><div id="filas"></div><p id="hora"></p></section>
<script>
const N = { juego: "Juego", online: "Online", login: "Ingreso" };
const filas = document.getElementById("filas"), hora = document.getElementById("hora");
function pintar(d) {
  filas.textContent = "";
  for (const k of Object.keys(N)) {
    const ok = d && d[k] === "ok", f = document.createElement("div");
    f.className = "fila " + (ok ? "ok" : "caido");
    const a = document.createElement("span"), b = document.createElement("span");
    a.textContent = N[k]; b.textContent = d ? (ok ? "Funciona" : "Caído") : "Sin datos";
    f.append(a, b); filas.append(f);
  }
  hora.textContent = d ? "Actualizado: " + new Date(d.actualizado).toLocaleString("es") : "";
}
fetch("https://junkedmetal.duckdns.org/api/status", { cache: "no-store" })
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(pintar)
  .catch(() => { filas.textContent = ""; hora.textContent = "Sin datos del servidor"; });
</script>
</main></body></html>
