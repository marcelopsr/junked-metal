<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Junked Metal red</title>
<style>body{font:15px system-ui,sans-serif;max-width:860px;margin:24px auto;padding:0 16px;background:#111;color:#ddd}
input,button{font:inherit;padding:6px 10px}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #333;padding:4px;text-align:left}
pre{white-space:pre-wrap;font-size:12px;background:#1a1a1a;padding:8px}</style></head><body>
<h1>Junked Metal: panel de red</h1>
<form id="f"><input id="k" type="password" placeholder="Clave de grupo o token" autocomplete="current-password"> <button>Entrar</button></form>
<div id="out"></div>
<script>
const out = document.getElementById("out"), esc = (s) => String(s).replace(/[&<>]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let tok = sessionStorage.getItem("jmTok");
document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault(); const v = document.getElementById("k").value.trim();
  if (v.includes(".")) tok = v; else {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ clave: v }) });
    const j = await r.json(); if (!r.ok) return (out.textContent = j.error); tok = j.token;
  }
  sessionStorage.setItem("jmTok", tok); load();
};
async function load() {
  if (!tok) return;
  const r = await fetch("/api/stats", { headers: { Authorization: "Bearer " + tok } });
  if (!r.ok) { sessionStorage.removeItem("jmTok"); return (out.textContent = "Token inválido o vencido"); }
  const s = await r.json(), h = Math.floor(s.uptime / 3600), m = Math.floor(s.uptime / 60) % 60;
  out.innerHTML = `<p>Activo hace ${h} h ${m} min. Salas: ${s.peers.filter((p) => p.sala).length}. Peers: ${s.peers.length}. Usuarios: ${s.usuarios.length}.</p>
  <h2>Peers</h2><table><tr><th>Id</th><th>Usuario</th><th>Tipo</th><th>Conectado</th></tr>${s.peers.map((p) => `<tr><td>${esc(p.id)}</td><td>${esc(p.uid)}</td><td>${p.sala ? "Sala" : "Invitado"}</td><td>${Math.round(p.seg / 60)} min</td></tr>`).join("") || "<tr><td colspan=4>Ninguno</td></tr>"}</table>
  <h2>Últimas sesiones TURN</h2><pre>${esc(s.turn.join("\n") || "Sin sesiones")}</pre>`;
}
load(); setInterval(load, 10000);
</script></body></html>
