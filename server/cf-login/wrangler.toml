name = "jm-login"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

# TEAM_DOMAIN y POLICY_AUD los fija la app de Access (ver server/README.md § Login Cloudflare). EXCHANGE_SECRET va como secreto (`wrangler secret put EXCHANGE_SECRET`); DEV_ORIGINS="true" solo en desarrollo local (.dev.vars), nunca en producción.
# El juego completo (build de dist/ con VITE_LOGIN_URL=<este worker>/login) se sirve desde acá, protegido por Access.
[assets]
directory = "../../dist"
binding = "ASSETS"
run_worker_first = ["/login"]

[vars]
TEAM_DOMAIN = "https://icy-cloud-e7b5.cloudflareaccess.com"
POLICY_AUD = "ed720dd5a2e287416f8f0b9a5f7e0d87198774f419b92ba99fc648a80c680017"
EXCHANGE_URL = "https://junkedmetal.duckdns.org/api/cf-exchange"
